<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
        <link rel="stylesheet" href="css/L.Control.Locate.min.css">
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <link rel="stylesheet" href="css/leaflet.photon.css">
        <link rel="stylesheet" href="css/leaflet-measure.css">
        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        </style>
        <title>FURSAN 2 TEST STATUS WEEKLY REPORT</title>
    </head>
    <body>
        <div id="map">
        </div>
        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/L.Control.Locate.min.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet.photon.js"></script>
        <script src="js/leaflet-measure.js"></script>
        <script src="js/proj4.js"></script>
        <script src="js/proj4leaflet.js"></script>
        <script src="data/FURSAN_RD_0.js"></script>
        <script src="data/FURSAN02__PROJECT_NETWORKS_1.js"></script>
        <script>
        var highlightLayer;
        function highlightFeature(e) {
            highlightLayer = e.target;

            if (e.target.feature.geometry.type === 'LineString' || e.target.feature.geometry.type === 'MultiLineString') {
              highlightLayer.setStyle({
                color: 'rgba(255, 255, 0, 1.00)',
              });
            } else {
              highlightLayer.setStyle({
                fillColor: 'rgba(255, 255, 0, 1.00)',
                fillOpacity: 1
              });
            }
        }
        var crs = new L.Proj.CRS('EPSG:32638', '+proj=utm +zone=38 +datum=WGS84 +units=m +no_defs', {
            resolutions: [2800, 1400, 700, 350, 175, 84, 42, 21, 11.2, 5.6, 2.8, 1.4, 0.7, 0.35, 0.14, 0.07],
        });
        var map = L.map('map', {
            crs: crs,
            continuousWorld: false,
            worldCopyJump: false, 
            zoomControl:false, maxZoom:28, minZoom:1
        })
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.update();
                    }, 10);
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }
        var title = new L.Control({'position':'topleft'});
        title.onAdd = function (map) {
            this._div = L.DomUtil.create('div', 'info');
            this.update();
            return this._div;
        };
        title.update = function () {
            this._div.innerHTML = '<h2>FURSAN 2 TEST STATUS WEEKLY REPORT</h2>';
        };
        title.addTo(map);
        var abstract = new L.Control({'position':'bottomleft'});
        abstract.onAdd = function (map) {
            this._div = L.DomUtil.create('div',
            'leaflet-control abstract');
            this._div.id = 'abstract'

                abstract.show();
                return this._div;
            };
            abstract.show = function () {
                this._div.classList.remove("abstract");
                this._div.classList.add("abstractUncollapsed");
                this._div.innerHTML = 'Weekly report showing the current status and progress of all testing activities for the FURSAN project, including completed and pending tests.';
        };
        abstract.addTo(map);
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        L.control.locate({locateOptions: {maxZoom: 19}}).addTo(map);
        var measureControl = new L.Control.Measure({
            position: 'topleft',
            primaryLengthUnit: 'feet',
            secondaryLengthUnit: 'miles',
            primaryAreaUnit: 'sqfeet',
            secondaryAreaUnit: 'sqmiles'
        });
        measureControl.addTo(map);
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].innerHTML = '';
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].className += ' fas fa-ruler';
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
            if (bounds_group.getLayers().length) {
                map.fitBounds(bounds_group.getBounds());
            }
            map.setMaxBounds(map.getBounds());
            map.setMinZoom(map.getZoom());
        }
        function pop_FURSAN_RD_0(feature, layer) {
            layer.on({
                mouseout: function(e) {
                    for (var i in e.target._eventParents) {
                        if (typeof e.target._eventParents[i].resetStyle === 'function') {
                            e.target._eventParents[i].resetStyle(e.target);
                        }
                    }
                },
                mouseover: highlightFeature,
            });
            var popupContent = '<table>\
                    <tr>\
                        <td class="visible-with-data" id="ROAD_NAME" colspan="2"><strong>ROAD_NAME</strong><br />' + (feature.properties['ROAD_NAME'] !== null ? autolinker.link(String(feature.properties['ROAD_NAME']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td class="visible-with-data" id="WIDTH" colspan="2"><strong>WIDTH</strong><br />' + (feature.properties['WIDTH'] !== null ? autolinker.link(String(feature.properties['WIDTH']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_FURSAN_RD_0_0() {
            return {
                pane: 'pane_FURSAN_RD_0',
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(23,23,23,0.4823529411764706)',
                interactive: true,
            }
        }
        map.createPane('pane_FURSAN_RD_0');
        map.getPane('pane_FURSAN_RD_0').style.zIndex = 400;
        map.getPane('pane_FURSAN_RD_0').style['mix-blend-mode'] = 'normal';
        var layer_FURSAN_RD_0 = new L.geoJson(json_FURSAN_RD_0, {
            attribution: '',
            interactive: true,
            dataVar: 'json_FURSAN_RD_0',
            layerName: 'layer_FURSAN_RD_0',
            pane: 'pane_FURSAN_RD_0',
            onEachFeature: pop_FURSAN_RD_0,
            style: style_FURSAN_RD_0_0,
        });
        bounds_group.addLayer(layer_FURSAN_RD_0);
        map.addLayer(layer_FURSAN_RD_0);
        function pop_FURSAN02__PROJECT_NETWORKS_1(feature, layer) {
            layer.on({
                mouseout: function(e) {
                    for (var i in e.target._eventParents) {
                        if (typeof e.target._eventParents[i].resetStyle === 'function') {
                            e.target._eventParents[i].resetStyle(e.target);
                        }
                    }
                },
                mouseover: highlightFeature,
            });
            var popupContent = '<table>\
                    <tr>\
                        <td colspan="2"><strong>Test statu</strong><br />' + (feature.properties['Test statu'] !== null ? autolinker.link(String(feature.properties['Test statu']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2"><strong>NETWORK:</strong><br />' + (feature.properties['NETWORK:'] !== null ? autolinker.link(String(feature.properties['NETWORK:']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2"><strong>ROAD_NAME:</strong><br />' + (feature.properties['ROAD_NAME:'] !== null ? autolinker.link(String(feature.properties['ROAD_NAME:']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2"><strong>Width :</strong><br />' + (feature.properties['Width :'] !== null ? autolinker.link(String(feature.properties['Width :']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_FURSAN02__PROJECT_NETWORKS_1_0(feature) {
            switch(String(feature.properties['Test statu'])) {
                case 'IRRIGATION test completed':
                    return {
                pane: 'pane_FURSAN02__PROJECT_NETWORKS_1',
                opacity: 1,
                color: 'rgba(31,120,180,1.0)',
                dashArray: '',
                lineCap: 'square',
                lineJoin: 'bevel',
                weight: 4.0,
                fillOpacity: 0,
                interactive: true,
            }
                    break;
                case 'IRRIGATION test not started':
                    return {
                pane: 'pane_FURSAN02__PROJECT_NETWORKS_1',
                opacity: 1,
                color: 'rgba(227,26,28,1.0)',
                dashArray: '',
                lineCap: 'square',
                lineJoin: 'bevel',
                weight: 4.0,
                fillOpacity: 0,
                interactive: true,
            }
                    break;
                case 'Storm test completed':
                    return {
                pane: 'pane_FURSAN02__PROJECT_NETWORKS_1',
                opacity: 1,
                color: 'rgba(31,120,180,1.0)',
                dashArray: '',
                lineCap: 'square',
                lineJoin: 'bevel',
                weight: 4.0,
                fillOpacity: 0,
                interactive: true,
            }
                    break;
                case 'STORM test not started':
                    return {
                pane: 'pane_FURSAN02__PROJECT_NETWORKS_1',
                opacity: 1,
                color: 'rgba(227,26,28,1.0)',
                dashArray: '',
                lineCap: 'square',
                lineJoin: 'bevel',
                weight: 4.0,
                fillOpacity: 0,
                interactive: true,
            }
                    break;
                case 'WATER test completed':
                    return {
                pane: 'pane_FURSAN02__PROJECT_NETWORKS_1',
                opacity: 1,
                color: 'rgba(31,120,180,1.0)',
                dashArray: '',
                lineCap: 'square',
                lineJoin: 'bevel',
                weight: 4.0,
                fillOpacity: 0,
                interactive: true,
            }
                    break;
                case 'WATER test not started':
                    return {
                pane: 'pane_FURSAN02__PROJECT_NETWORKS_1',
                opacity: 1,
                color: 'rgba(227,26,28,1.0)',
                dashArray: '',
                lineCap: 'square',
                lineJoin: 'bevel',
                weight: 4.0,
                fillOpacity: 0,
                interactive: true,
            }
                    break;
                default:
                    return {
                pane: 'pane_FURSAN02__PROJECT_NETWORKS_1',
                opacity: 1,
                color: 'rgba(43,131,186,1.0)',
                dashArray: '',
                lineCap: 'square',
                lineJoin: 'bevel',
                weight: 4.0,
                fillOpacity: 0,
                interactive: true,
            }
                    break;
            }
        }
        map.createPane('pane_FURSAN02__PROJECT_NETWORKS_1');
        map.getPane('pane_FURSAN02__PROJECT_NETWORKS_1').style.zIndex = 401;
        map.getPane('pane_FURSAN02__PROJECT_NETWORKS_1').style['mix-blend-mode'] = 'normal';
        var layer_FURSAN02__PROJECT_NETWORKS_1 = new L.geoJson(json_FURSAN02__PROJECT_NETWORKS_1, {
            attribution: '',
            interactive: true,
            dataVar: 'json_FURSAN02__PROJECT_NETWORKS_1',
            layerName: 'layer_FURSAN02__PROJECT_NETWORKS_1',
            pane: 'pane_FURSAN02__PROJECT_NETWORKS_1',
            onEachFeature: pop_FURSAN02__PROJECT_NETWORKS_1,
            style: style_FURSAN02__PROJECT_NETWORKS_1_0,
        });
        bounds_group.addLayer(layer_FURSAN02__PROJECT_NETWORKS_1);
        map.addLayer(layer_FURSAN02__PROJECT_NETWORKS_1);
        var overlaysTree = [
            {label: 'FURSAN02__PROJECT_NETWORKS<br /><table><tr><td style="text-align: center;"><img src="legend/FURSAN02__PROJECT_NETWORKS_1_IRRIGATIONtestcompleted0.png" /></td><td>IRRIGATION test completed</td></tr><tr><td style="text-align: center;"><img src="legend/FURSAN02__PROJECT_NETWORKS_1_IRRIGATIONtestnotstarted1.png" /></td><td>IRRIGATION test not started</td></tr><tr><td style="text-align: center;"><img src="legend/FURSAN02__PROJECT_NETWORKS_1_Stormtestcompleted2.png" /></td><td>Storm test completed</td></tr><tr><td style="text-align: center;"><img src="legend/FURSAN02__PROJECT_NETWORKS_1_STORMtestnotstarted3.png" /></td><td>STORM test not started</td></tr><tr><td style="text-align: center;"><img src="legend/FURSAN02__PROJECT_NETWORKS_1_WATERtestcompleted4.png" /></td><td>WATER test completed</td></tr><tr><td style="text-align: center;"><img src="legend/FURSAN02__PROJECT_NETWORKS_1_WATERtestnotstarted5.png" /></td><td>WATER test not started</td></tr><tr><td style="text-align: center;"><img src="legend/FURSAN02__PROJECT_NETWORKS_1_6.png" /></td><td></td></tr></table>', layer: layer_FURSAN02__PROJECT_NETWORKS_1},
            {label: '<img src="legend/FURSAN_RD_0.png" /> FURSAN_RD', layer: layer_FURSAN_RD_0},]
        var lay = L.control.layers.tree(null, overlaysTree,{
            //namedToggle: true,
            //selectorBack: false,
            //closedSymbol: '&#8862; &#x1f5c0;',
            //openedSymbol: '&#8863; &#x1f5c1;',
            //collapseAll: 'Collapse all',
            //expandAll: 'Expand all',
            collapsed: true,
        });
        lay.addTo(map);
        setBounds();
        </script>        
    </body>
</html>
